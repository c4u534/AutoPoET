<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoPoET - Collective Architecture</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; background-color: #1e1e1e; color: #d4d4d4; }
        .app-container { display: grid; grid-template-columns: 250px 1fr; grid-template-rows: 60px 1fr; height: 100vh; background-color: #000; gap: 2px; }
        .header { grid-column: 1 / -1; background-color: #333; display: flex; align-items: center; padding: 0 20px; font-size: 1.4em; font-weight: bold; }
        .sidebar { grid-row: 2; background-color: #252526; padding: 15px; }
        .workspace { grid-row: 2; background-color: #1e1e1e; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        button { background-color: #007acc; color: white; border: none; padding: 10px 15px; cursor: pointer; font-size: 1em; border-radius: 4px; }
        button:hover { background-color: #005f9e; }
        pre { background-color: #000; padding: 15px; border-radius: 4px; overflow-x: auto; border: 1px solid #444; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">AutoPoET Collective Architecture Framework</div>

        <div class="sidebar">
            <h3>Framework Control</h3>
            <p>Execute the core Python architectures assembled in the backend.</p>
            <button id="run-sim-btn">Run Intelligence Simulation</button>
        </div>

        <div class="workspace">
            <h2>Execution Output</h2>
            <div id="output-container">
                <p>Awaiting execution...</p>
                <pre id="json-output"></pre>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
